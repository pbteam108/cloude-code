<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>競合製品リサーチ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; }
    header { background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%); color: white; padding: 20px 28px; }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header p { font-size: 0.85rem; opacity: 0.85; margin-top: 4px; }
    main { max-width: 1300px; margin: 28px auto; padding: 0 16px; }
    .search-section { background: white; border-radius: 12px; padding: 20px 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); display: flex; gap: 12px; }
    .search-section input { flex: 1; padding: 11px 16px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    .search-section input:focus { border-color: #2563eb; }
    .search-section button { padding: 11px 28px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .search-section button:disabled { background: #93c5fd; cursor: not-allowed; }

    .col-panel { background: white; border-radius: 12px; padding: 16px 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-top: 14px; }
    .col-panel-header { font-size: 0.78rem; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
    .toggle-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .toggle-chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border: 2px solid #e2e8f0; border-radius: 20px; background: #f8fafc; cursor: pointer; user-select: none; transition: all 0.15s; font-size: 0.85rem; font-weight: 500; color: #555; }
    .toggle-chip.on { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; }
    .toggle-chip input { display: none; }
    .toggle-chip .del { margin-left: 4px; color: #aaa; font-size: 0.8rem; cursor: pointer; }
    .toggle-chip .del:hover { color: #ef4444; }

    .add-col-row { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
    .add-col-row input { padding: 6px 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 0.85rem; outline: none; width: 200px; }
    .add-col-row input:focus { border-color: #2563eb; }
    .add-col-row button { padding: 6px 14px; background: #f0f9ff; color: #2563eb; border: 2px solid #2563eb; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .add-col-row button:hover { background: #dbeafe; }

    #summary-box { background: #eff6ff; border-left: 4px solid #2563eb; border-radius: 8px; padding: 14px 18px; margin-top: 16px; font-size: 0.88rem; line-height: 1.65; display: none; }
    #status { text-align: center; color: #64748b; padding: 36px 0; font-size: 0.92rem; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .table-wrap { background: white; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow-x: auto; margin-top: 16px; }
    table { width: 100%; border-collapse: collapse; }
    thead th { background: #f8fafc; padding: 11px 14px; text-align: left; font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 2px solid #e2e8f0; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid #f1f5f9; transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8fbff; }
    td { padding: 12px 14px; font-size: 0.88rem; vertical-align: middle; }

    .col-image { width: 90px; }
    .product-img { width: 72px; height: 72px; object-fit: contain; border-radius: 8px; border: 1px solid #e2e8f0; background: #f8fafc; display: block; }
    .img-placeholder { width: 72px; height: 72px; background: #f1f5f9; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
    .col-name { font-weight: 600; max-width: 180px; }
    .col-name a { color: #2563eb; text-decoration: none; }
    .col-name a:hover { text-decoration: underline; }
    .col-company { color: #555; max-width: 140px; }
    .col-price { font-weight: 700; color: #dc2626; white-space: nowrap; }
    .col-volume { white-space: nowrap; color: #444; }
    .col-features { max-width: 300px; color: #555; line-height: 1.55; font-size: 0.83rem; }
    .col-url a { display: inline-block; padding: 5px 12px; background: #eff6ff; color: #2563eb; border-radius: 6px; font-size: 0.8rem; font-weight: 600; text-decoration: none; white-space: nowrap; }
    .col-url a:hover { background: #dbeafe; }
    .col-custom { max-width: 180px; color: #444; font-size: 0.85rem; }
    .empty { color: #ccc; }
    .error { background: #fef2f2; border-left: 4px solid #ef4444; border-radius: 8px; padding: 16px; color: #b91c1c; margin-top: 16px; font-size: 0.9rem; }
    @media (max-width: 600px) { .search-section { flex-direction: column; } }
  </style>
</head>
<body>
  <header>
    <h1>競合製品リサーチ</h1>
    <p>カテゴリーを入力すると競合製品を一覧表示します</p>
  </header>
  <main>
    <div class="search-section">
      <input type="text" id="category" placeholder="例: 甘酒、グラノーラ、プロテインバー" autocomplete="off" />
      <button id="searchBtn" onclick="doSearch()">検索</button>
    </div>

    <div class="col-panel" id="colPanel" style="display:none">
      <div class="col-panel-header">表示する項目</div>
      <div class="toggle-list" id="toggleList"></div>
      <div class="add-col-row">
        <input type="text" id="newColInput" placeholder="項目を追加（例：産地、原材料）" maxlength="20" />
        <button onclick="addCustomCol()">＋ 追加</button>
      </div>
    </div>

    <div id="summary-box"></div>
    <div id="status"></div>
    <div id="results"></div>
  </main>

  <script>
    const FIXED_COLS = [
      { key: "image",    label: "商品画像",  deletable: false },
      { key: "name",     label: "商品名",    deletable: false },
      { key: "company",  label: "会社名",    deletable: false },
      { key: "price",    label: "価格",      deletable: false },
      { key: "volume",   label: "内容量",    deletable: false },
      { key: "features", label: "特徴",      deletable: false },
      { key: "url",      label: "リンク",    deletable: false },
    ];

    let currentData = null;

    // Custom columns: array of label strings
    function loadCustomCols() {
      try { const s = localStorage.getItem("cr_custom_cols"); if (s) return JSON.parse(s); } catch(e) {}
      return [];
    }
    function saveCustomCols(cols) {
      localStorage.setItem("cr_custom_cols", JSON.stringify(cols));
    }
    function getCustomCols() {
      return loadCustomCols().map(label => ({ key: `custom_${label}`, label, deletable: true }));
    }
    function getAllCols() {
      return [...FIXED_COLS, ...getCustomCols()];
    }

    // Column visibility prefs
    function loadColPrefs() {
      try { const s = localStorage.getItem("cr_cols"); if (s) return JSON.parse(s); } catch(e) {}
      return getAllCols().map(c => c.key);
    }
    function saveColPrefs() {
      const active = getAllCols()
        .filter(c => document.querySelector(`input[data-col="${c.key}"]`)?.checked)
        .map(c => c.key);
      localStorage.setItem("cr_cols", JSON.stringify(active));
    }
    function getActiveCols() {
      return getAllCols()
        .filter(c => document.querySelector(`input[data-col="${c.key}"]`)?.checked)
        .map(c => c.key);
    }

    function initToggles() {
      const saved = loadColPrefs();
      const list = document.getElementById("toggleList");
      list.innerHTML = "";
      getAllCols().forEach(col => {
        const isOn = saved.includes(col.key);
        const chip = document.createElement("label");
        chip.className = "toggle-chip" + (isOn ? " on" : "");
        chip.dataset.key = col.key;

        let inner = `<input type="checkbox" data-col="${col.key}" ${isOn ? "checked" : ""}>${col.label}`;
        if (col.deletable) {
          inner += `<span class="del" data-label="${col.label}" onclick="deleteCustomCol(event, '${col.label}')">×</span>`;
        }
        chip.innerHTML = inner;

        chip.addEventListener("click", (e) => {
          if (e.target.classList.contains("del")) return;
          e.preventDefault();
          const cb = chip.querySelector("input");
          cb.checked = !cb.checked;
          chip.classList.toggle("on", cb.checked);
          saveColPrefs();
          if (currentData) renderTable(currentData);
        });
        list.appendChild(chip);
      });
    }

    function addCustomCol() {
      const input = document.getElementById("newColInput");
      const label = input.value.trim();
      if (!label) return;
      const cols = loadCustomCols();
      if (cols.includes(label)) { input.value = ""; return; }
      cols.push(label);
      saveCustomCols(cols);
      // Add to visibility prefs
      const prefs = loadColPrefs();
      prefs.push(`custom_${label}`);
      localStorage.setItem("cr_cols", JSON.stringify(prefs));
      input.value = "";
      initToggles();
      if (currentData) renderTable(currentData);
    }

    function deleteCustomCol(e, label) {
      e.stopPropagation();
      const cols = loadCustomCols().filter(c => c !== label);
      saveCustomCols(cols);
      const prefs = loadColPrefs().filter(k => k !== `custom_${label}`);
      localStorage.setItem("cr_cols", JSON.stringify(prefs));
      initToggles();
      if (currentData) renderTable(currentData);
    }

    document.getElementById("category").addEventListener("keydown", (e) => {
      if (e.key === "Enter") doSearch();
    });
    document.getElementById("newColInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") addCustomCol();
    });

    async function doSearch() {
      const category = document.getElementById("category").value.trim();
      if (!category) return;
      const btn = document.getElementById("searchBtn");
      const statusEl = document.getElementById("status");
      const summaryBox = document.getElementById("summary-box");
      const resultsEl = document.getElementById("results");

      btn.disabled = true;
      resultsEl.innerHTML = "";
      summaryBox.style.display = "none";
      statusEl.innerHTML = '<span class="spinner"></span>検索中...（10〜20秒ほどかかります）';

      const customFields = loadCustomCols();

      try {
        const res = await fetch("/api/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ category, custom_fields: customFields }),
        });
        if (!res.ok) { const err = await res.json(); throw new Error(err.detail || "エラーが発生しました"); }
        const data = await res.json();
        currentData = data;
        statusEl.innerHTML = "";
        document.getElementById("colPanel").style.display = "block";
        initToggles();
        if (data.summary) { summaryBox.textContent = data.summary; summaryBox.style.display = "block"; }
        renderTable(data);
      } catch(err) {
        statusEl.innerHTML = "";
        resultsEl.innerHTML = `<div class="error">${esc(err.message)}</div>`;
      } finally { btn.disabled = false; }
    }

    function renderTable(data) {
      const el = document.getElementById("results");
      if (!data.competitors || data.competitors.length === 0) {
        el.innerHTML = '<div style="text-align:center;padding:36px;color:#999">見つかりませんでした。別のキーワードを試してください。</div>';
        return;
      }
      const activeCols = getActiveCols();
      const visibleCols = getAllCols().filter(c => activeCols.includes(c.key));
      if (visibleCols.length === 0) {
        el.innerHTML = '<div style="text-align:center;padding:36px;color:#999">項目を1つ以上選んでください。</div>';
        return;
      }

      let html = '<div class="table-wrap"><table><thead><tr>';
      visibleCols.forEach(col => { html += `<th>${col.label}</th>`; });
      html += '</tr></thead><tbody>';

      data.competitors.forEach(item => {
        html += '<tr>';
        visibleCols.forEach(col => {
          html += `<td class="${col.key.startsWith('custom_') ? 'col-custom' : 'col-' + col.key}">`;
          if (col.key.startsWith("custom_")) {
            const val = item[col.key];
            html += val ? esc(val) : '<span class="empty">—</span>';
          } else {
            switch(col.key) {
              case "image":
                html += item.image
                  ? `<img class="product-img" src="${esc(item.image)}" alt="${esc(item.name)}" loading="lazy" onerror="this.outerHTML='<div class=\\"img-placeholder\\">📦</div>'">`
                  : '<div class="img-placeholder">📦</div>';
                break;
              case "name":
                html += item.url
                  ? `<a href="${esc(item.url)}" target="_blank" rel="noopener">${esc(item.name)}</a>`
                  : esc(item.name);
                break;
              case "company": html += item.company ? esc(item.company) : '<span class="empty">—</span>'; break;
              case "price":   html += item.price   ? esc(item.price)   : '<span class="empty">—</span>'; break;
              case "volume":  html += item.volume  ? esc(item.volume)  : '<span class="empty">—</span>'; break;
              case "features":html += item.features? esc(item.features): '<span class="empty">—</span>'; break;
              case "url":
                html += item.url
                  ? `<a href="${esc(item.url)}" target="_blank" rel="noopener">サイトを見る →</a>`
                  : '<span class="empty">—</span>';
                break;
            }
          }
          html += '</td>';
        });
        html += '</tr>';
      });

      html += '</tbody></table></div>';
      el.innerHTML = html;
    }

    function esc(str) {
      if (!str) return "";
      return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    initToggles();
  </script>
</body>
</html>
